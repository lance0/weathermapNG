# Copy this example to the parent directory of the WeathermapNG checkout.
# Keep existing librenms_db/librenms_rrd/librenms_logs volumes when upgrading.

services:
  db:
    image: mariadb:10.5
    container_name: librenms-db
    command:
      - "mysqld"
      - "--innodb-file-per-table=1"
      - "--lower-case-table-names=0"
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
    environment:
      - TZ=UTC
      - MARIADB_RANDOM_ROOT_PASSWORD=yes
      - MYSQL_DATABASE=librenms
      - MYSQL_USER=librenms
      - MYSQL_PASSWORD=librenms_password
    volumes:
      - librenms_db:/var/lib/mysql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: librenms-redis
    restart: unless-stopped

  librenms:
    image: librenms/librenms:latest
    container_name: librenms-weathermap
    hostname: librenms
    cap_add:
      - NET_ADMIN
      - NET_RAW
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    volumes:
      - librenms_data:/data
      - librenms_rrd:/data/rrd
      - librenms_logs:/data/logs
      - ./WeathermapNG:/opt/librenms/html/plugins/WeathermapNG
      - ./WeathermapNG/docker/99-weathermapng.sh:/etc/cont-init.d/99-weathermapng.sh:ro
    environment:
      - S6_BEHAVIOUR_IF_STAGE2_FAILS=2
      - TZ=UTC
      - PUID=1000
      - PGID=1000
      - DB_HOST=db
      - DB_NAME=librenms
      - DB_USER=librenms
      - DB_PASSWORD=librenms_password
      - DB_TIMEOUT=60
      - REDIS_HOST=redis
    restart: unless-stopped


volumes:
  librenms_db:
  librenms_rrd:
  librenms_logs:
  librenms_data:
