name: CI

# Cancel superseded runs on the same branch/PR; never cancel main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  embed-auth:
    needs: lint
    uses: ./.github/workflows/embed-auth.yml

  lint:
    runs-on: ubuntu-latest
    name: PHP Lint & Metadata
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: gd, json, mbstring, pdo, pdo_mysql
          coverage: none

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Lint all PHP sources
        run: just lint

      - name: Validate version metadata
        run: just check-metadata

  test:
    runs-on: ubuntu-latest
    name: PHPUnit (${{ matrix.php-version }})
    timeout-minutes: 15
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: gd, json, mbstring, pdo
          tools: composer:v2
          coverage: none

      # Cache composer's own download cache (not vendor/) — vendor
      # restoration is fragile across PHP versions; the dist cache makes
      # `composer install` near-instant and always consistent with the lock.
      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-dist-${{ runner.os }}-php${{ matrix.php-version }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-dist-${{ runner.os }}-php${{ matrix.php-version }}-
            composer-dist-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Run tests
        run: just test

  docker-test:
    runs-on: ubuntu-latest
    name: PHPUnit (Docker / LibreNMS image)
    timeout-minutes: 15
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Composer dependencies
        run: |
          docker run --rm \
            --entrypoint composer \
            -v "$PWD":/opt/librenms/html/plugins/WeathermapNG \
            -w /opt/librenms/html/plugins/WeathermapNG \
            librenms/librenms:latest \
            install --no-interaction --no-progress --prefer-dist

      - name: Run PHPUnit inside LibreNMS Docker image
        run: |
          docker run --rm \
            --entrypoint php \
            -v "$PWD":/opt/librenms/html/plugins/WeathermapNG \
            -w /opt/librenms/html/plugins/WeathermapNG \
            librenms/librenms:latest \
            vendor/bin/phpunit --no-coverage

  security:
    runs-on: ubuntu-latest
    name: Security Check
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Check for hardcoded secrets
        run: just check-security

  docs:
    runs-on: ubuntu-latest
    name: Documentation Validation
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Check required docs and install-guidance alignment
        run: just check-docs

      - name: Check no stale references to deleted classes
        run: |
          set -e
          # These classes were deleted in v1.7.0; docs should only reference
          # them in the context of "removed" — not as active code.
          for class in SseStreamService MapDataBuilder MapPolicy NodePolicy; do
            # Allow mentions in CHANGELOG (historical) and ROADMAP/VERSIONING
            # (annotating removal), but not in README/INSTALL/API as active.
            if grep -r "$class" README.md docs/INSTALL.md docs/API.md 2>/dev/null | \
               grep -v "removed\|deleted\|dead\|was\|earlier\|older"; then
              echo "ERROR: $class referenced as active in docs"
              exit 1
            fi
          done
          echo "No stale class references found"
