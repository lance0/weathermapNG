name: Installation Tests

# Cancel superseded runs; never cancel the weekly schedule (identical group
# per ref means scheduled main runs are also protected by cancel-in-progress
# being false for main).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

on:
  push:
    branches: [main, develop]
    paths:
      - 'quick-install.sh'
      - 'deploy.sh'
      - 'scripts/install-common.sh'
      - 'verify-deployment.php'
      - 'verify.php'
      - 'database/**'
      - 'docker-compose*.yml'
      - 'docker/**'
      - '.github/workflows/embed-auth.yml'
      - '.env.*'
      - 'composer.json'
      - 'src/**'
      - 'routes/**'
      - 'views/**'
      - 'resources/**'
      - 'README.md'
      - 'docs/INSTALL.md'
      - 'tests/**'
      - '.github/workflows/installation-tests.yml'
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'quick-install.sh'
      - 'deploy.sh'
      - 'scripts/install-common.sh'
      - 'verify-deployment.php'
      - 'verify.php'
      - 'database/**'
      - 'docker-compose*.yml'
      - 'docker/**'
      - '.github/workflows/embed-auth.yml'
      - '.env.*'
      - 'composer.json'
      - 'src/**'
      - 'routes/**'
      - 'views/**'
      - 'resources/**'
      - 'README.md'
      - 'docs/INSTALL.md'
      - 'tests/**'
      - '.github/workflows/installation-tests.yml'

permissions:
  contents: read

jobs:
  script-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Validate Scripts

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: gd, json, pdo, pdo_mysql, mbstring
          coverage: none

      - name: Validate bash scripts
        run: |
          bash -n quick-install.sh
          bash -n deploy.sh
          bash -n scripts/install-common.sh
          bash -n tests/install-lock-test.sh
          bash -n tests/install-failure-test.sh
          bash -n tests/install-lifecycle-test.sh
          bash -n tests/native-install-test.sh
          bash -n docker/99-weathermapng.sh
          bash -n tests/install-test.sh
          bash -n tests/docker-test.sh

      - name: Validate PHP scripts
        run: |
          php -l verify.php
          php -l tests/integration_lifecycle_fixture.php
          php -l src/WeathermapNG.php

  docker-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Docker Compose Validation

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Prepare environment
        run: |
          cp .env.docker .env
          sed -i 's/your_db_name/testdb/g' .env
          sed -i 's/your_db_user/testuser/g' .env
          sed -i 's/your_db_password/testpass/g' .env
          sed -i 's/your_root_password/rootpass/g' .env

      - name: Validate Docker Compose files
        run: |
          for f in docker-compose.simple.yml docker-compose.example.yml docker-compose.dev.yml; do
            if [ -f "$f" ]; then
              echo "Validating $f..."
              docker compose -f "$f" config > /dev/null
            fi
          done

  plugin-structure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Validate Plugin Structure

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check required files
        run: |
          set -e
          echo "Checking plugin structure..."
          for file in src/WeathermapNG.php routes/web.php composer.json phpunit.xml README.md docs/INSTALL.md; do
            test -f "$file" || (echo "MISSING: $file" && exit 1)
            echo "  OK: $file"
          done

      - name: Check hook files
        run: |
          set -e
          for hook in MenuEntry Settings; do
            test -f "src/Hooks/$hook.php" || (echo "MISSING: src/Hooks/$hook.php" && exit 1)
            echo "  OK: src/Hooks/$hook.php"
          done

      - name: Check no deleted files remain
        run: |
          set -e
          # Files removed in v1.7.0 cleanup
          for dead in map-poller.php test_hooks.php debug_plugin_web.php; do
            if [ -f "$dead" ]; then
              echo "ERROR: deleted file should not exist: $dead"
              exit 1
            fi
          done
          # Deleted source classes
          for dead in src/Services/SseStreamService.php src/Services/MapDataBuilder.php src/Policies/MapPolicy.php src/Policies/NodePolicy.php; do
            if [ -f "$dead" ]; then
              echo "ERROR: deleted class should not exist: $dead"
              exit 1
            fi
          done
          echo "No deleted files found"

  composer-registration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Composer Path Registration

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: gd, json, mbstring
          tools: composer:v2
          coverage: none

      - name: Register plugin as LibreNMS path package
        run: |
          set -euo pipefail

          LIBRENMS_ROOT="$(mktemp -d)"
          mkdir -p "$LIBRENMS_ROOT/html/plugins"
          ln -s "$GITHUB_WORKSPACE" "$LIBRENMS_ROOT/html/plugins/WeathermapNG"

          cd "$LIBRENMS_ROOT"
          composer init --no-interaction --name=weathermapng/ci-librenms --type=project
          composer config repositories.weathermapng '{"type":"path","url":"html/plugins/WeathermapNG","options":{"symlink":true}}'
          composer require 'librenms/weathermapng:*' --with-dependencies --no-interaction --no-progress

          composer show librenms/weathermapng
          test -L vendor/librenms/weathermapng || test -d vendor/librenms/weathermapng

      - name: Validate Laravel provider metadata
        run: |
          php <<'PHP'
          <?php
          $composer = json_decode(file_get_contents("composer.json"), true);
          $providers = $composer["extra"]["laravel"]["providers"] ?? [];
          if (! in_array("LibreNMS\\Plugins\\WeathermapNG\\WeathermapNGProvider", $providers, true)) {
              fwrite(STDERR, "Missing Laravel provider metadata\n");
              exit(1);
          }
          PHP

  mocked-install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: Mock Quick Install Flow

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: gd, json, pdo, mbstring
          coverage: none

      - name: Check required install and upgrade failures
        run: |
          bash tests/install-failure-test.sh
          bash tests/install-lock-test.sh

  native-upgrade:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    name: Native VM Upgrade

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare exact revision bundle
        run: |
          set -euo pipefail
          git fetch --force origin tag v1.15.1
          test "$(git rev-parse 'v1.15.1^{commit}')" = 38830b0db55bc0f40f3c8fa981ccc24d6723bb8f
          git update-ref refs/heads/candidate HEAD
          git bundle create /tmp/wmng-candidate.bundle refs/heads/candidate refs/tags/v1.15.1
          chmod 644 /tmp/wmng-candidate.bundle
          cp tests/integration_lifecycle_fixture.php /tmp/wmng-native-fixture.php
          chmod 644 /tmp/wmng-native-fixture.php
          printf '%s\n' "$(git rev-parse HEAD)" > /tmp/wmng-candidate-sha

      - name: Qualify native upgrade and upstream reconstruction
        run: |
          sudo bash tests/native-install-test.sh "$(cat /tmp/wmng-candidate-sha)" \
            /tmp/wmng-candidate.bundle /tmp/wmng-native-fixture.php \
            "$RUNNER_TEMP/wmng-native-evidence"

      - name: Preserve redacted evidence
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/wmng-native-evidence" ]; then
            sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/wmng-native-evidence"
          fi

      - name: Upload native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-upgrade-evidence
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/wmng-native-evidence/*.log
            ${{ runner.temp }}/wmng-native-evidence/*-report.json
            ${{ runner.temp }}/wmng-native-evidence/*-snapshot.json
            ${{ runner.temp }}/wmng-native-evidence/*-http.json
            ${{ runner.temp }}/wmng-native-evidence/*-result.txt
            ${{ runner.temp }}/wmng-native-evidence/*-status.txt
            ${{ runner.temp }}/wmng-native-evidence/revisions.txt
            ${{ runner.temp }}/wmng-native-evidence/runtime-versions.txt

  weekly-librenms-smoke:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/embed-auth.yml
