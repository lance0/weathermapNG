name: Embed Authentication

on:
  workflow_call:

permissions:
  contents: read

jobs:
  embed-auth:
    name: LibreNMS HTTP and browser regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Start disposable LibreNMS stack
        run: |
          sudo chown -R 1000:1000 "$GITHUB_WORKSPACE"
          docker compose -p wmng-auth -f docker-compose.dev.yml up -d db redis librenms
          for _ in {1..90}; do
            # Docker's port proxy can accept TCP before application initialization.
            status=$(curl -s -o "$RUNNER_TEMP/wmng-live.json" -w '%{http_code}' http://localhost:8000/plugin/WeathermapNG/live) || status=000
            if [ "$status" = 200 ] && jq -e '.alive == true' "$RUNNER_TEMP/wmng-live.json" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Configure browser fixtures
        run: |
          docker exec librenms-dev sh -c '
            for config in /data/.env /opt/librenms/.env; do
              sed -i "/^INSTALL=/d; /^WEATHERMAPNG_EMBED_TOKEN=/d; /^WEATHERMAPNG_DEMO_MODE=/d" "$config"
              printf "\nWEATHERMAPNG_EMBED_TOKEN=%s\nWEATHERMAPNG_DEMO_MODE=true\nINSTALL=false\n" "$WEATHERMAPNG_EMBED_TOKEN" >> "$config"
            done
          '

      - name: Exercise real session/token middleware and route binding
        run: |
          docker exec -u librenms librenms-dev php /opt/librenms/html/plugins/WeathermapNG/tests/integration_embed_auth_test.php
          docker exec -u librenms librenms-dev php /opt/librenms/html/plugins/WeathermapNG/tests/integration_install_report_test.php
          docker exec -u librenms -w /opt/librenms librenms-dev php artisan route:cache
          docker exec -u librenms librenms-dev php /opt/librenms/html/plugins/WeathermapNG/tests/integration_embed_auth_test.php
          docker exec -u librenms librenms-dev php /opt/librenms/html/plugins/WeathermapNG/tests/integration_install_report_test.php

      - name: Verify recoverable version restores on MariaDB
        run: docker exec -u librenms librenms-dev php /opt/librenms/html/plugins/WeathermapNG/tests/integration_version_test.php

      - name: Qualify populated legacy schema upgrades in a scratch database
        run: bash tests/install-upgrade-test.sh

      - name: Qualify native dependency restoration and Docker lifecycle
        run: bash tests/install-lifecycle-test.sh

      - name: Install test browser
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/wmng-browser" playwright@1.62.1
          "$RUNNER_TEMP/wmng-browser/node_modules/.bin/playwright" install --with-deps chromium

      - name: Verify version restore authorization and HTTP recovery
        run: NODE_PATH="$RUNNER_TEMP/wmng-browser/node_modules" node tests/version-restore-browser.cjs

      - name: Exercise first-run onboarding in Chromium
        run: NODE_PATH="$RUNNER_TEMP/wmng-browser/node_modules" node tests/onboarding-browser.cjs

      - name: Check bounded topology renderer and gallery previews
        run: |
          node tests/topology-preview-test.cjs
          NODE_PATH="$RUNNER_TEMP/wmng-browser/node_modules" node tests/topology-preview-browser.cjs

      - name: Exercise editor, viewer updates, and token navigation in Chromium
        run: NODE_PATH="$RUNNER_TEMP/wmng-browser/node_modules" node tests/embed-auth-browser.cjs

      - name: Show container logs on failure
        if: failure()
        run: docker compose -p wmng-auth -f docker-compose.dev.yml logs --no-color --tail 100

      - name: Remove disposable stack
        if: always()
        run: |
          docker compose -p wmng-auth -f docker-compose.dev.yml down --volumes
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
